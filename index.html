<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The World Pixel Square</title>
    <style>
        /* डार्क थीम और बिना इंटरनेट के चलने वाला स्टाइल */
        body {
            background-color: #030712;
            color: #ffffff;
            font-family: sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            justify-content: space-between;
        }
        header {
            background-color: #111827;
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid #1f2937;
        }
        h1 {
            color: #22d3ee;
            margin: 0;
            font-size: 20px;
            letter-spacing: 1px;
        }
        header p {
            color: #9ca3af;
            font-size: 11px;
            margin: 5px 0 0 0;
        }
        main {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(20, 16px);
            grid-gap: 3px;
            background-color: #111827;
            padding: 10px;
            border-radius: 12px;
            border: 1px solid #1f2937;
        }
        .pixel {
            width: 16px;
            height: 16px;
            background-color: #374151;
            border-radius: 2px;
            cursor: pointer;
        }
        .pixel:hover {
            background-color: #22d3ee;
        }
        /* बुक किए हुए पिक्सल्स के रंग */
        .claimed-1 { background-color: #10b981; }
        .claimed-2 { background-color: #8b5cf6; }
        
        /* पॉपअप बॉक्स (Modal) */
        .modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0,0,0,0.8);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-content {
            background-color: #111827;
            border: 1px solid #1f2937;
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 280px;
            text-align: center;
            position: relative;
        }
        .close-btn {
            position: absolute;
            top: 10px; right: 15px;
            background: none; border: none;
            color: #9ca3af; font-size: 20px; cursor: pointer;
        }
        .pixel-id {
            font-size: 11px; color: #22d3ee;
            background-color: #083344;
            padding: 2px 6px; border-radius: 4px;
        }
        .avatar {
            width: 60px; height: 60px;
            background-color: #1f2937;
            border-radius: 50%;
            margin: 15px auto;
            display: flex; align-items: center; justify-content: center;
            font-size: 24px;
        }
        .chat-btn {
            width: 100%;
            background-color: #0891b2;
            color: white; border: none;
            padding: 10px; border-radius: 8px;
            font-weight: bold; cursor: pointer;
            margin-top: 10px;
        }
        footer {
            background-color: #111827;
            padding: 10px;
            font-size: 11px;
            color: #6b7280;
            display: flex;
            justify-content: space-around;
            border-t: 1px solid #1f2937;
        }
    </style>
</head>
<body>

    <header>
        <h1>The World Pixel Square</h1>
        <p>Claim your spot for ₹1 & connect globally</p>
    </header>

    <main>
        <div class="grid-container" id="grid">
            <!-- पिक्सल्स यहाँ जावास्क्रिप्ट से बनेंगे -->
        </div>
    </main>

    <div id="pixelModal" class="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal()">&times;</button>
            <span id="modalPixelId" class="pixel-id">Pixel #0</span>
            <div class="avatar">👤</div>
            <h3 style="margin: 10px 0 5px 0;">John Doe 🇺🇸</h3>
            <p style="font-size: 12px; color: #9ca3af; font-style: italic; margin: 0 0 15px 0;">"Building the future! Say hi!"</p>
            <button class="chat-btn" onclick="alert('चैट फीचर डेटाबेस जोड़ने के बाद चालू होगा!')">💬 Say Hi / Chat</button>
        </div>
    </div>

    <footer>
        <div>Total: 400</div>
        <div style="color: #10b981;">Claimed: 58</div>
        <div style="color: #22d3ee;">Live: 14</div>
    </footer>

    <script>
        const grid = document.getElementById('grid');
        for (let i = 1; i <= 400; i++) {
            const pixel = document.createElement('div');
            pixel.className = 'pixel';
            
            // कुछ पिक्सल्स को पहले से भरा हुआ दिखाने के लिए
            if (i % 7 === 0) pixel.classList.add('claimed-1');
            else if (i % 13 === 0) pixel.classList.add('claimed-2');
            
            pixel.onclick = () => openModal(i);
            grid.appendChild(pixel);
        }

        function openModal(id) {
            document.getElementById('modalPixelId').innerText = `Pixel #${id}`;
            document.getElementById('pixelModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('pixelModal').style.display = 'none';
        }
    </script>
</body>
</html>       </html>
